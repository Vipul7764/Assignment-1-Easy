<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pikachu UI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- LEFT SECTION -->
    <div class="left">

      <img 
        src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" 
        class="logo"
      >

      <div class="content">

        <p class="small-title">POKEMON GEN I</p>

        <h1>Pikachu</h1>

        <p class="description">
          Pikachu is an Electric-type Pokémon introduced in Generation I.
          Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
          They are almost completely covered by yellow fur.
        </p>

        <div class="pagination">
          <span class="line"></span>
          <span class="page">01 / 08</span>
        </div>

      </div>

      <div class="pokeball"></div>

    </div>



    <!-- RIGHT SECTION -->
    <div class="right">

      <div class="menu">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <img 
        src="Pokemon-Yellow-Free-PNG.png" 
        class="pikachu"
      >

      <div class="dots">
        <span class="active"></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>

</body>
</html>
